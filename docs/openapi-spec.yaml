                  type: object
                  additionalProperties: {}
        '401':
          description: Chưa đăng nhập, token hết hạn hoặc đã bị thu hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Không đủ role/grant, hoặc tự phê duyệt (SELF_APPROVAL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Báo cáo quỹ lương theo kỳ
      description: '**Quyền / quy tắc:** Grant VIEW.'
