# HRFlow – OpenAPI 3 (hop dong API chinh thuc)
# Sinh tu ma nguon backend bang springdoc + scripts bo sung mo ta. Cap nhat: 2026-11-12.
openapi: 3.0.3
info:
  title: HRFlow API – HNQ Media
  version: 3.3.0
  description: 'Hợp đồng API chính thức của HRFlow (chấm công QR, nghỉ phép, OT, tính lương tự động).


    **Quy ước chung** (xem docs/CONVENTIONS.md):

    - Base path `/api/v1`, JSON camelCase, enum UPPERCASE, ngày `YYYY-MM-DD`, thời điểm ISO-8601 UTC, tiền là số VND.

    - Xác thực: `Authorization: Bearer <JWT>` (lấy từ `POST /auth/login`, hết hạn sau 60 phút).

    - Lỗi thống nhất `ApiError {code, message, details[{field,message}], timestamp}` theo DEC-01: 401 chưa đăng nhập/token hỏng · 403 không có
    role/grant hoặc tự duyệt · 404 không tồn tại hoặc ngoài phạm vi dữ liệu · 409 sai trạng thái/kỳ đã chốt/xung đột cập nhật · 422 dữ liệu không
    hợp lệ.

    - Phân trang (nếu có): `?page=0&size=20` → `{content, page, size, totalElements, totalPages}`.


    File này được sinh từ mã nguồn (springdoc) rồi bổ sung mô tả; Swagger UI chạy tại `/swagger-ui.html`.'
servers:
- url: http://localhost:8080
  description: Backend chạy local
- url: http://localhost:3000
  description: Qua proxy của Vite (frontend dev)
security:
- bearerAuth: []
