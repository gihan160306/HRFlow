  description: Chấm công QR động, bảng công, Needs Review, điều chỉnh (FR-07, FR-10)
- name: Leave
  description: Nghỉ phép và quỹ phép (FR-08, FR-28)
- name: Overtime
  description: Lịch OT, đăng ký, xác nhận thực tế (FR-09)
- name: Income & Sales
  description: Thưởng/khấu trừ, doanh thu Sales (FR-11, FR-12)
- name: Payroll
  description: Kỳ lương, tính lương, duyệt, khóa, phiếu lương, adjustment, tham số (FR-13..18, FR-23, FR-24, FR-27, FR-30)
- name: Dashboard, Notifications, Audit
  description: Dashboard, báo cáo, thông báo, audit, tác vụ nền (FR-20..22, FR-25)
