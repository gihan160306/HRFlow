spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/HRFlow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.hrflow: DEBUG
    org.flywaydb: INFO