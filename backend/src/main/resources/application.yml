spring:
  application:
    name: HRFlow

  profiles:
    default: dev

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${APP_JWT_SECRET:c2VjdXJlX2hyZmxvd19qd3Rfc2VjcmV0X2tleV8yMDI2X2FudGlncmF2aXR5X2RlbW9faHI=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

hrflow:
  cors:
    allowed-origins: ${HRFLOW_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  payroll:
    regional-min-wage: ${HRFLOW_PAYROLL_REGIONAL_MIN_WAGE:4960000}
  attendance:
    work-start: "08:30"
    work-end: "17:30"
    lunch-start: "12:00"
    lunch-end: "13:00"
    shortfall-tolerance-minutes: 15


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
