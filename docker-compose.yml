# Enterprise HR & Automated Payroll System - docker compose (NFR-09)
#
# Chạy:            docker compose up -d --build
# Kèm mail giả:    docker compose --profile dev up -d --build     (xem email tại http://localhost:8025)
# Xem trạng thái:  docker compose ps
# Tắt, giữ dữ liệu: docker compose down
# Tắt và XÓA dữ liệu: docker compose down -v   (xóa cả dữ liệu DB)
#
# Kiến trúc: PostgreSQL 16 + backend Spring Boot (Java 21, cổng 8080, Flyway tự chạy migration + seed demo)
#            + frontend React (Vite build, nginx cổng 80, proxy /api -> backend nên cùng origin, không cần CORS).
# Job nền (sinh phiếu lương PDF...) chạy trong chính backend bằng @Scheduled, không cần service worker riêng.

name: hr-payroll

# Biến môi trường của backend.
x-backend-env: &backend-env
  TZ: ${TZ:-Asia/Ho_Chi_Minh}
  SPRING_PROFILES_ACTIVE: dev
  SERVER_PORT: "8080"
  # Kết nối DB: trong mạng compose, host luôn là `db` (đọc bởi application-dev.yml).
  DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-hr_payroll}
  DB_USERNAME: ${DB_USER:-hr_payroll}
  DB_PASSWORD: ${DB_PASSWORD:?Hãy đặt DB_PASSWORD trong file .env}
  # Khóa ký JWT: chuỗi Base64 của >= 32 byte ngẫu nhiên (xem .env.example).
  APP_JWT_SECRET: ${APP_JWT_SECRET:?Hãy đặt APP_JWT_SECRET trong file .env}
  APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-3600000}
  # Phiên của tài khoản thiết bị KIOSK (máy chấm công tại quầy), mặc định 12 giờ.
  APP_JWT_KIOSK_EXPIRATION_MS: ${APP_JWT_KIOSK_EXPIRATION_MS:-43200000}
  HRFLOW_CORS_ALLOWED_ORIGINS: ${HRFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  # Chấm công tại quầy (DEC-10): hạn QR cá nhân, hạn gửi ảnh sau khi quét, khoảng tối thiểu trước khi check-out
  ATTENDANCE_EMPLOYEE_QR_TTL_SECONDS: ${ATTENDANCE_EMPLOYEE_QR_TTL_SECONDS:-15}
  ATTENDANCE_PUNCH_WINDOW_SECONDS: ${ATTENDANCE_PUNCH_WINDOW_SECONDS:-30}
  ATTENDANCE_MIN_CHECKOUT_GAP_MINUTES: ${ATTENDANCE_MIN_CHECKOUT_GAP_MINUTES:-30}
  ATTENDANCE_PHOTO_MAX_KB: ${ATTENDANCE_PHOTO_MAX_KB:-200}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-hr_payroll}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Hãy đặt DB_PASSWORD trong file .env}
      POSTGRES_DB: ${DB_NAME:-hr_payroll}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Chỉ mở cho máy local để dùng DBeaver/psql. Trên server thật nên bỏ dòng này.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s


  frontend:
    build:
      context: ./frontend
      args:
        # Biến VITE_* được nhúng vào bundle lúc BUILD: đổi giá trị thì phải build lại.
        # Mặc định /api/v1 (cùng origin, nginx proxy sang backend).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Hộp thư giả để xem email (phiếu lương, cảnh báo hợp đồng) khi phát triển.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # giao diện web
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP

volumes:
  pgdata:
